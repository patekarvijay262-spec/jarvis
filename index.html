<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jarvis</title>
  <meta name="description" content="Vijay's personal growth tracker: Body, Brain, Mind.">
  <meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F1F3F0" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=9">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Main">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="54 28" stroke-linecap="round"/><circle cx="16" cy="16" r="6" fill="currentColor"/></svg></span>
        <span class="brand-name">Jarvis</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="syncState"></div>
    </aside>

    <main class="main">
      <header class="top">
        <div class="top-left">
          <h1 id="viewTitle">Today</h1>
          <div class="datenav" id="dateNav">
            <button class="icon-btn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
            <button class="date-label" id="dateLabel"></button>
            <button class="icon-btn" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
        </div>
        <div class="top-right">
          <button class="icon-btn" id="themeBtn" aria-label="Switch theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
          <button class="avatar" id="accountBtn" aria-label="Account"></button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

  <script type="module" src="js/app.js?v=9"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
